[project]
name = "voicebot"
version = "0.1.0"
description = "外呼机器人（智能体）：实时流式语音对话引擎 + 话术编排平台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "agentscope>=2.0",
    "openai>=1.50",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
web = ["aiortc>=1.9"]
audio = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "funasr>=1.3",
    # CosyVoice2 运行时依赖（源码在 third_party/，不入库）
    "conformer",
    "diffusers==0.29.0",
    "einops",
    "gdown",
    "matplotlib",
    "scipy",
    "tiktoken",
    "torchcodec==0.11.1",
    "transformers==4.51.3",
    "x-transformers",
    "hydra-core",
    "HyperPyYAML",
    "inflect",
    "lightning>=2.2.4",
    "omegaconf",
    "onnx",
    "pyarrow",
    "pyworld",
    "onnxruntime-gpu==1.20.2",
    "openai-whisper",
    "rich",
    "wetext==0.0.4",
    "wget",
]
db = ["sqlalchemy>=2.0", "asyncpg>=0.30", "pgvector>=0.3"]
retrieval = ["sentence-transformers>=4.0,<5.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
# 说明：matcha（Matcha-TTS）不装 pip 包——PyPI 元数据带 gradio(→websockets<12) 与项目冲突，
# 仓库 pyproject 亦过旧无法构建；CosyVoice 仅用其纯 torch 子模块，故与 CosyVoice 一样
# 以源码形式放 third_party/Matcha-TTS 并加入 sys.path（见 docs/local-models.md）

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
