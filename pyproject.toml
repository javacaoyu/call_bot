[project]
name = "voicebot"
version = "0.1.0"
description = "外呼机器人（智能体）：实时流式语音对话引擎 + 话术编排平台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "agentscope>=2.0",
    "openai>=1.50",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
web = ["aiortc>=1.9"]
audio = ["torch>=2.6", "funasr>=1.3"]
db = ["sqlalchemy>=2.0", "asyncpg>=0.30", "pgvector>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
