services:
  db:
    image: pgvector/pgvector:pg16
    container_name: voicebot-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voicebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicebot}
      POSTGRES_DB: ${POSTGRES_DB:-voicebot}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voicebot} -d ${POSTGRES_DB:-voicebot}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
